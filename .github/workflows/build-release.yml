name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Tests
        run: |
          python -m unittest discover tests

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "AccessibleTimeline" `
            --add-data "sounds;sounds" `
            --add-data "README.html;." `
            --add-data "CHANGELOG.txt;." `
            --add-binary "src/audio/lib/x64/bass.dll;src/audio/lib/x64" `
            main.py

      - name: Package Distributable Zip
        shell: powershell
        run: |
          Copy-Item -Path "README.html" -Destination "dist\AccessibleTimeline\README.html"
          Copy-Item -Path "CHANGELOG.txt" -Destination "dist\AccessibleTimeline\CHANGELOG.txt"
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "AccessibleTimeline-$tag-windows-x64.zip"
          Compress-Archive -Path dist\AccessibleTimeline\* -DestinationPath dist\$zipName
          Write-Host "Created package: dist\$zipName"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
